name: Auto Approve Documentation Changes

# ⚠️ Note: Auto-merge is DISABLED to enforce manual code review
# As per the branch workflow requirements (Jan 2026), all PRs require human review
# before merging to main branch.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  status: {}

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: read

    steps:
    # No checkout here on purpose. This job runs on pull_request_target with a
    # write-scoped token, so checking out the fork's head would execute
    # attacker-controlled content in a privileged context.
    # File list comes from the API instead, which works for fork and non-fork PRs.
    - name: Check that only docs/config files changed
      id: changed-files
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename')
        echo "Changed files:"
        echo "$files"
        if echo "$files" | grep -qE '^\.github/'; then
          echo "only_changed=false" >> "$GITHUB_OUTPUT"
        elif echo "$files" | grep -qvE '\.(md|ya?ml)$|^docs/'; then
          echo "only_changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "only_changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Label documentation/config changes (NO auto-merge)
      if: steps.changed-files.outputs.only_changed == 'true'
      uses: juliangruber/approve-pull-request-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        number: ${{ github.event.pull_request.number }}
        body: |
          🤖 This PR only contains:

          - 📝 Documentation changes (`.md` files)
          - ⚙️ Configuration changes (`.yml`/`.yaml` files)

          ✅ Auto-approved by bot, but **manual human review is required** before merge.

          Please review the changes and merge manually when ready.

  # AUTO-MERGE IS DISABLED
  # All PRs require manual human review and merge
  # To re-enable auto-merge, uncomment the job below:
  #
  # auto-merge:
  #   runs-on: ubuntu-latest
  #   needs: auto-approve
  #   permissions:
  #     pull-requests: write
  #     contents: write
  #
  #   steps:
  #   - name: Auto-merge approved PRs
  #     uses: peter-evans/enable-pull-request-automerge@v3
  #     with:
  #       token: ${{ secrets.GITHUB_TOKEN }}
  #       pull-request-number: ${{ github.event.pull_request.number }}
  #       merge-method: squash
