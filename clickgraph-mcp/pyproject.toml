[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clickgraph-mcp"
version = "0.1.0"
description = "Model Context Protocol server for ClickGraph"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["mcp", "cypher", "clickhouse", "graph", "clickgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
clickgraph-mcp = "clickgraph_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clickgraph_mcp*"]
