# ClickHouse for the LDBC SNB benchmark, with ClickHouse's default (unlimited)
# memory settings. `scripts/load_data.py` applies schemas/clickhouse_ddl.sql and
# loads the CSVs. On a host with about 8 GB for Docker, add
# `-f docker-compose.8gb.yaml` to cap each query.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.11
    container_name: clickgraph-ldbc-clickhouse
    ports:
      - "8123:8123"   # HTTP interface, used by both the loader and ClickGraph
    volumes:
      - ldbc_clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=ldbc
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user=default", "--password=default", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ldbc_clickhouse_data:
