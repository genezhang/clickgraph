# DeltaGraph demo schema — identical graph to social_demo.yaml, but pointed at
# the Databricks-side tables (catalog.schema = workspace.social). Row-parity with
# the ClickHouse `social` DB: users 30 / posts 50 / follows 60 / likes 80 / authored 50.
name: social_demo_databricks

graph_schema:
  nodes:
    - label: User
      database: workspace.social
      table: users
      node_id: user_id
      property_mappings:
        user_id: user_id
        name: name
        email: email
        created_at: created_at

    - label: Post
      database: workspace.social
      table: posts
      node_id: post_id
      property_mappings:
        post_id: post_id
        content: content
        created_at: created_at

  edges:
    - type: FOLLOWS
      database: workspace.social
      table: user_follows
      from_node: User
      to_node: User
      from_id: follower_id
      to_id: followed_id
      property_mappings:
        created_at: created_at

    - type: AUTHORED
      database: workspace.social
      table: post_authored
      from_node: User
      to_node: Post
      from_id: user_id
      to_id: post_id
      property_mappings:
        created_at: created_at

    - type: LIKED
      database: workspace.social
      table: post_likes
      from_node: User
      to_node: Post
      from_id: user_id
      to_id: post_id
      property_mappings:
        created_at: created_at
